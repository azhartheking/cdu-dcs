<style>
/* ISA-101 style: grey, low-contrast normal state, colour reserved for abnormal situations */
:root{
  --bg:#c6c8ca; --panel:#d9dbdc; --panel2:#e6e7e8; --line:#8d9195; --eq:#b3b6b9; --eqs:#53575c;
  --pipe:#45494e; --gas:#6c7177; --cw:#7d8c99; --txt:#121416; --mut:#4a4e53; --dim:#6b6f74;
  --p1:#e10600; --p2:#f0b000; --p3:#b400b4; --ok:#2f7d32; --sel:#1d4fbf; --white:#f7f7f7;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font:12px/1.35 "Segoe UI",Arial,sans-serif;display:flex;flex-direction:column;min-height:100vh}
button{font:inherit;cursor:pointer;background:var(--panel2);border:1px solid var(--line);border-radius:2px;padding:3px 8px;color:var(--txt)}
button:hover{background:#f0f1f2}
button.on{background:#53575c;color:#fff;border-color:#33373b}
button.warn{border-color:var(--p1);color:var(--p1);font-weight:600}
input,select{font:inherit;border:1px solid var(--line);background:#fff;padding:2px 4px;border-radius:2px}
input[type=number]{width:80px}
a{color:var(--sel)}

/* ---------- header ---------- */
#hdr{background:#a9acaf;border-bottom:1px solid #85898d;position:sticky;top:0;z-index:20}
.hrow{display:flex;align-items:center;gap:10px;padding:4px 10px;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.06em;font-size:13px}
.brand small{font-weight:400;color:var(--mut);letter-spacing:0;margin-left:6px}
.clock{font:600 15px Consolas,monospace;background:#e8e9ea;border:1px solid var(--line);padding:1px 8px;min-width:96px;text-align:center}
.grp{display:flex;gap:2px;align-items:center}
.spacer{flex:1}
.chip{background:#e8e9ea;border:1px solid var(--line);padding:2px 8px;border-radius:2px;white-space:nowrap}
.chip b{font-weight:600}
.almbadge{display:flex;gap:3px;text-decoration:none;color:var(--txt)}
.almbadge span{min-width:34px;text-align:center;border:1px solid var(--line);padding:2px 5px;background:#e8e9ea;font-weight:600}
.almbadge .a1.act{background:var(--p1);color:#fff}
.almbadge .a2.act{background:var(--p2)}
.almbadge .a3.act{background:var(--p3);color:#fff}
.blink{animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
nav.pages{display:flex;gap:1px;padding:0 10px;flex-wrap:wrap;background:#9b9ea1}
nav.pages a{padding:5px 11px;color:var(--txt);text-decoration:none;background:#b9bcbf;border:1px solid #8d9195;border-bottom:none;margin-top:3px;position:relative}
nav.pages a.cur{background:var(--bg);font-weight:600}
nav.pages a .dot{position:absolute;top:2px;right:2px;width:7px;height:7px;border-radius:50%}
nav.pages a .dot.p1{background:var(--p1)} nav.pages a .dot.p2{background:var(--p2)} nav.pages a .dot.p3{background:var(--p3)}

/* ---------- layout ---------- */
#main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:8px;padding:8px 10px}
#view{min-width:0;display:flex;flex-direction:column;gap:8px}
#side{display:flex;flex-direction:column;gap:8px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:2px}
.card h3{margin:0;padding:4px 8px;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;background:#c3c5c7;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.card h3 a{font-weight:400;text-transform:none;letter-spacing:0}
.card .bd{padding:6px 8px}
.gfxwrap{background:var(--panel);border:1px solid var(--line);position:relative}
svg.gfx{display:block;width:100%;height:auto;user-select:none}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}
@media (max-width:1000px){#main{grid-template-columns:1fr}}

/* ---------- svg graphic ---------- */
.eq{fill:var(--eq);stroke:var(--eqs);stroke-width:1.5}
.eq2{fill:#c4c7ca;stroke:var(--eqs);stroke-width:1.2}
.bed{fill:#9fa3a7;stroke:none}
.pipe{fill:none;stroke:var(--pipe);stroke-width:2.6}
.pipe.gas{stroke:var(--gas);stroke-width:2;stroke-dasharray:none}
.pipe.liq{stroke:#3d4248;stroke-width:2}
.pipe.cw{stroke:var(--cw);stroke-width:1.6;stroke-dasharray:6 3}
.pipe.cat{stroke:#3d4248;stroke-width:1.6}
.pipe.sig{stroke:#777;stroke-width:1;stroke-dasharray:3 3}
.pipe.thin{stroke-width:1.4}
.pipe.dead{stroke:#a3a6a9}
.lbl{font:600 11px "Segoe UI",Arial;fill:var(--txt)}
.lbl.s{font-weight:400;font-size:10px;fill:var(--mut)}
.lbl.big{font-size:13px;letter-spacing:.04em}
.lbl.area{font-size:12px;fill:#55595e;letter-spacing:.08em}
.tagbox{cursor:pointer}
.tagbox rect.b{fill:#e4e5e6;stroke:#7d8186;stroke-width:1}
.tagbox:hover rect.b{stroke:var(--sel);stroke-width:1.6}
.tagbox.sel rect.b{stroke:var(--sel);stroke-width:2.2}
.tagbox .t{font:600 10.5px "Segoe UI",Arial}
.tagbox .v{font:600 13px Consolas,monospace}
.tagbox .u{font:10px "Segoe UI",Arial;fill:var(--mut)}
.tagbox .s{font:10px Consolas,monospace;fill:#333}
.tagbox .m{font:600 9px "Segoe UI";fill:var(--txt)}
.tagbox .mbg{fill:#f7f7f7;stroke:#333;stroke-width:.8}
.tagbox.standby .v,.tagbox.standby .s,.tagbox.standby .u{opacity:.45}
.tagbox.a1 rect.b{stroke:var(--p1);stroke-width:2.6}.tagbox.a2 rect.b{stroke:var(--p2);stroke-width:2.6}.tagbox.a3 rect.b{stroke:var(--p3);stroke-width:2.6}
.tagbox .ab{display:none}
.tagbox.a1 .ab,.tagbox.a2 .ab,.tagbox.a3 .ab{display:inline}
.tagbox.a1 .ab rect{fill:var(--p1)} .tagbox.a2 .ab rect{fill:var(--p2)} .tagbox.a3 .ab rect{fill:var(--p3)}
.tagbox.unack .ab{animation:blink 1s steps(2,start) infinite}
.ind rect.b{fill:#e9eaeb;stroke:#a2a5a8}
.motor{cursor:pointer}
.motor .body{fill:#f2f2f2;stroke:var(--eqs);stroke-width:1.6}
.motor.run .body{fill:#5b5f64}
.motor.run .mk{fill:#f2f2f2}
.motor .mk{fill:var(--eqs)}
.motor.trip .body{stroke:var(--p1);stroke-width:3}
.motor:hover .body{stroke:var(--sel)}
.valve{fill:#f2f2f2;stroke:var(--eqs);stroke-width:1.3}
.valve.open{fill:#6a6e73}
.link{cursor:pointer}
.link path{fill:#e4e5e6;stroke:#55595e;stroke-width:1.2}
.link:hover path{fill:#fff;stroke:var(--sel)}
.link text{font:600 10px "Segoe UI";fill:var(--txt)}
.area-r{fill:transparent;stroke:#8f9397;stroke-width:1.2;stroke-dasharray:5 4;cursor:pointer}
.area-r:hover{fill:rgba(255,255,255,.25);stroke:var(--sel)}
.lvl{fill:#7e8389}
.alarmfill{fill:var(--p1)!important}
.flow-anim{stroke-dasharray:8 8;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-16}}
.particles circle{fill:#6e7378}

/* ---------- faceplate ---------- */
.fp .tag{font:700 16px Consolas,monospace}
.fp .desc{color:var(--mut);margin-bottom:6px}
.fp .grid{display:grid;grid-template-columns:44px 1fr;gap:8px}
.fp .bar{position:relative;height:150px;background:#eceded;border:1px solid var(--line)}
.fp .bar .pvb{position:absolute;left:4px;right:22px;bottom:0;background:#6b6f74}
.fp .bar .spm{position:absolute;left:0;right:16px;height:0;border-top:2px solid var(--sel)}
.fp .bar .opb{position:absolute;right:3px;width:12px;bottom:0;background:#a8abaf;border:1px solid #777}
.fp table{width:100%;border-collapse:collapse}
.fp td{padding:2px 3px;border-bottom:1px solid #c9cbcd}
.fp td.k{color:var(--mut);width:40px}
.fp td.v{font:600 14px Consolas,monospace;text-align:right}
.fp td.uu{color:var(--mut);width:46px}
.fp .row{display:flex;gap:4px;align-items:center;margin-top:5px;flex-wrap:wrap}
.fp .row input{width:84px}
.fp .note{color:var(--mut);font-size:11px;margin-top:4px}
.fp .big{font:700 20px Consolas,monospace}
.state{display:inline-block;padding:1px 7px;border:1px solid var(--line);background:#fff;font-weight:600}
.state.bad{background:var(--p1);color:#fff;border-color:var(--p1)}
.state.warn{background:var(--p2)}

/* ---------- tables ---------- */
table.t{width:100%;border-collapse:collapse;font-size:11.5px}
table.t th,table.t td{border:1px solid #b9bcbf;padding:3px 6px;text-align:right;white-space:nowrap}
table.t th{background:#cfd1d3;font-weight:600;text-align:center}
table.t td.l,table.t th.l{text-align:left}
table.t tr:nth-child(even) td{background:#e1e2e3}
table.t td.bad{background:var(--p1)!important;color:#fff;font-weight:600}
table.t td.diff{background:#f6dd8d!important;font-weight:600}
table.t td.okc{color:var(--ok);font-weight:600}
table.t tr.clk{cursor:pointer}
table.t tr.clk:hover td{background:#f4f4f4}
.kv{display:grid;grid-template-columns:1fr auto auto;gap:1px 8px;align-items:baseline}
.kv .k{color:var(--mut)}
.kv .v{font:600 13px Consolas,monospace;text-align:right}
.kv .u{color:var(--mut);font-size:10.5px}
.kv .v.bad{color:var(--p1)}
.alm-row td{font-size:11.5px}
.alm-row.p1 td:first-child{background:var(--p1);color:#fff}
.alm-row.p2 td:first-child{background:var(--p2)}
.alm-row.p3 td:first-child{background:var(--p3);color:#fff}
.alm-row.unack td:first-child{animation:blink 1s steps(2,start) infinite}
.alm-row.rtn td{color:#777}

/* ---------- bottom banner ---------- */
#banner{background:#b3b6b9;border-top:1px solid #85898d;padding:3px 10px;font-size:11.5px;min-height:62px}
#banner table{width:100%;border-collapse:collapse}
#banner td{padding:1px 6px;white-space:nowrap}
#banner td.msg{width:100%;white-space:normal}
#banner tr{cursor:pointer}
canvas.trend{width:100%;display:block;background:#eceded;border:1px solid var(--line)}
.legend{display:grid;grid-template-columns:14px 1fr auto auto;gap:1px 6px;font-size:11px;padding:4px 2px;align-items:center}
.legend i{display:inline-block;width:12px;height:3px}
.legend .v{font:600 12px Consolas,monospace;text-align:right}
.legend .r{color:var(--mut);font-size:10px}
.hint{color:var(--mut);font-size:11px}
.tabs{display:flex;gap:3px;flex-wrap:wrap}
.disclaimer{color:var(--mut);font-size:10.5px;padding:0 10px 6px}
.fail-grid{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center}
.ex{border:1px solid #b9bcbf;background:#e4e5e6;padding:6px 8px;margin-bottom:6px}
.ex b{display:block}
.ex p{margin:3px 0 5px;color:var(--mut)}

/* ---------- session (shift handover) menu ---------- */
.modal{position:fixed;inset:0;background:rgba(40,42,45,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:28px 16px}
.mbox{background:#f3f3f1;border:1px solid var(--line);border-radius:4px;max-width:940px;width:100%;padding:14px 18px 16px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.mhd{display:flex;justify-content:space-between;align-items:center;font:700 19px "Segoe UI",Arial;margin-bottom:4px}
.mhd .mx{font-size:14px;padding:2px 9px}
.mgrade{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.msec{font:700 12.5px "Segoe UI",Arial;letter-spacing:.06em;text-transform:uppercase;color:#45494e;margin:14px 0 6px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.mtile{text-align:left;background:#fcfcfb;border:1px solid #c9cbcd;border-radius:4px;padding:9px 11px;display:flex;flex-direction:column;gap:4px}
.mtile b{font-size:13px}
.mtile span{color:var(--mut);font-size:11.5px;line-height:1.4}
.mtile:hover{border-color:var(--sel);background:#fff}
.mtile:focus-visible{outline:2px solid var(--sel)}
.mtile:disabled{opacity:.5;cursor:not-allowed}
ol.proc{margin:4px 0;padding-left:20px;font-size:11.5px}
ol.proc li{margin:2px 0}
ol.proc li a{color:var(--txt);text-decoration:none}
ol.proc li.done a{color:var(--ok);text-decoration:line-through}
ol.proc li.next{font-weight:600}
ol.proc li.next a{color:var(--sel)}
.motor.run .mk[stroke]{stroke:#f2f2f2}

/* faceplate recipe-SP hint */
.fp .row.recipe{background:#e6e7e8;border:1px solid #c3c5c7;padding:3px 5px;justify-content:space-between}
.fp .row.recipe.diff{background:#f6dd8d;border-color:#d8b33c}
.fp .row.recipe .hint b{color:var(--txt);font-family:Consolas,monospace}


/* ---------- pop-out windows (?pop=1) ---------- */
.popmenu{position:absolute;right:0;top:calc(100% + 4px);z-index:50;background:var(--panel2);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.25);display:flex;flex-direction:column;min-width:240px;padding:3px}
.popmenu button{border:none;background:transparent;text-align:left;padding:6px 10px}
.popmenu button:hover{background:#fff}
body.pop nav.pages, body.pop #side, body.pop #banner, body.pop .disclaimer, body.pop .brand small, body.pop #hdr .np{display:none!important}
body.pop #main{grid-template-columns:minmax(0,1fr);padding:6px}
body.pop .hrow{padding:3px 8px;gap:6px}
body.pop .brand::after{content:" · POP-OUT";font-weight:400;color:var(--mut)}
a.popa{text-decoration:none;margin-left:8px;font-weight:600}

/* ---------- run lamps on motors ---------- */
.motor .lamp{stroke:#333;stroke-width:.8}
.motor .lamp.on{fill:#22b04b}
.motor .lamp.off{fill:#d32f2f}
.motor .lamp.tr{fill:#ff1a1a;animation:blink .7s steps(2,start) infinite}
.motor.tripped .body{stroke:var(--p1);stroke-width:3;animation:blink 1s steps(2,start) infinite}

/* ---------- PSV / PRV symbols ---------- */
.psv{cursor:pointer}
.psv .pv{fill:#f2f2f2;stroke:#45494e;stroke-width:1.2}
.psv.static .pv{fill:#e2e3e4}
.psv.open .pv{fill:var(--p1);stroke:#7a0000}
.psv.open text{fill:var(--p1);font-weight:700}
.psv.sel .pv{stroke:var(--sel);stroke-width:2}
.psv:hover .pv{stroke:var(--sel)}
.pipe.flare{stroke:#8a6d3b;stroke-width:1.8;stroke-dasharray:7 3}
.pipe.flare.hot{stroke:var(--p1);stroke-dasharray:7 3;animation:flow .6s linear infinite}
.pipe.util{stroke-width:1.6}
.pipe.steam{stroke:#9c4f4f;stroke-width:1.6;stroke-dasharray:2 3}
.pipe.n2{stroke:#4f6d9c;stroke-width:1.6;stroke-dasharray:10 3 2 3}
.pipe.air{stroke:#5f8a5f;stroke-width:1.6;stroke-dasharray:1 3}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .35s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1)}to{transform:scale(1.08,.92)}}

/* ---------- safety alert pop-up ---------- */
#szalert{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-start;justify-content:center;padding-top:12vh;background:rgba(20,20,20,.28);pointer-events:auto}
#szalert .ab{width:min(560px,92vw);background:#fff;border:3px solid var(--p1);box-shadow:0 10px 40px rgba(0,0,0,.45)}
#szalert.k-psv .ab{border-color:#d07a00}
#szalert .ah{background:var(--p1);color:#fff;font:700 16px "Segoe UI";padding:8px 12px;letter-spacing:.06em;display:flex;gap:8px;align-items:center}
#szalert.k-psv .ah{background:#d07a00}
#szalert .ah .at{margin-left:auto;font:600 13px Consolas,monospace}
#szalert .abd{padding:12px 14px}
#szalert .att{font:700 17px "Segoe UI";margin-bottom:6px}
#szalert .amsg{font-size:13px;line-height:1.45}
#szalert .amore{margin-top:8px;color:var(--mut);font-size:12px}
#szalert .abtn{display:flex;gap:6px;justify-content:flex-end;padding:8px 12px 12px;flex-wrap:wrap}
#szalert .abtn button{padding:6px 12px;font-size:13px}

/* control-valve tag under the valve symbol */
.lbl.vtag{font:600 9.5px Consolas,monospace;fill:#2b2f33}


/* CDU line classes: crude, hot hydrocarbon, residue, water, fuel gas */
.pipe.crude{stroke:#3d4248;stroke-width:3}
.pipe.hc{stroke:#3d4248;stroke-width:2}
.pipe.res{stroke:#2b2f33;stroke-width:3.2}
.pipe.water{stroke:#6f8fa8;stroke-width:1.7;stroke-dasharray:5 2}

<script>
/* =====================================================================
   CDU (CRUDE DISTILLATION UNIT 11) DCS TRAINING SIMULATOR — PROCESS MODEL
   Training-grade dynamic model built from public training material (Unit 11 CDU training module,
   textbook CDU theory). Lumped first-order lags, mass and energy balances. NOT design data.
   Sections: 1 crudes, TBP curves & operating cases · 2 controller / equipment catalogue
             3 state factory · 4 PID · 5 process step (100 preheat & desalting · 200 heater
             · 300 fractionator · 400 overhead & stabilizer · 500 rundown & dryers)

   ===================================================================== */
(function (G) {
'use strict';
const CDU = G.CDU = G.CDU || {};
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lag = (y, u, tau, dt) => y + (u - y) * (1 - Math.exp(-dt / Math.max(tau, 1e-6)));
const pos = (x) => Math.max(0, x);
CDU.clamp = clamp; CDU.lag = lag;

/* ---------------- 1. CRUDES, TBP CURVES, OPERATING CASES ----------------
   TBP: cumulative wt% distilled (dry crude) vs true boiling point °C. The 165/205/330/370 °C points
   are the design cut points of the book (yields LPG/naphtha/kero/LGO/HGO/residue); the rest is
   interpolated from typical curves for a light paraffinic (Bach Ho) and a medium sour (Dubai) crude. */
CDU.CRUDES = {
  BH: { name: 'Bach Ho', api: 39.2, S: 0.03, salt: 14, water: 0.61, gas: 0.0005, fz0: -47.2, p0: -7, cet0: 56, smk0: 26, den0: 0.785,
    tbp: [[-50, 0], [30, 0.272], [80, 3.2], [120, 7.6], [165, 13.65], [205, 19.97], [260, 29.6], [330, 41.06], [370, 49.68], [450, 63.0], [550, 77.0], [700, 91.0], [900, 100]] },
  DB: { name: 'Dubai', api: 31.2, S: 2.1, salt: 56, water: 0.44, gas: 0.0012, fz0: -65, p0: -15, cet0: 49, smk0: 21, den0: 0.805,
    tbp: [[-50, 0], [30, 0.864], [80, 4.6], [120, 9.9], [165, 16.94], [205, 22.97], [260, 31.6], [330, 42.11], [370, 50.14], [450, 60.0], [550, 72.0], [700, 86.0], [900, 100]] },
  FL: { name: 'SR flushing oil (gas oil)', tbp: [[240, 0], [270, 3], [300, 12], [330, 30], [360, 60], [390, 85], [420, 96], [460, 100]] }
};
function interp(c, T) {
  if (T <= c[0][0]) return c[0][1];
  for (let i = 1; i < c.length; i++) if (T <= c[i][0]) { const a = c[i - 1], b = c[i]; return a[1] + (b[1] - a[1]) * (T - a[0]) / (b[0] - a[0]); }
  return c[c.length - 1][1];
}
// cumulative wt% of a mixture: x = Bach Ho fraction of the crude, w = crude fraction of the inventory (rest flushing oil), dT = noise shift
CDU.cum = (x, w, T, dT, fo) => { const t = T - (dT || 0); return w * (x * interp(CDU.CRUDES.BH.tbp, t) + (1 - x) * interp(CDU.CRUDES.DB.tbp, t)) + (1 - w) * interp(CDU.CRUDES.FL.tbp, t - (fo || 0)); };

CDU.crudeProps = function (x) {
  const B = CDU.CRUDES.BH, D = CDU.CRUDES.DB, m = (k) => x * B[k] + (1 - x) * D[k];

};

function pidStep(c, def, pv, dt) {

  c.pv = pv;
  if (def.hand) { c.mode = 'MAN'; return; }
  const span = def.hi - def.lo;
  const e = (pv - c.sp) / span * 100 * def.act;
  const y = pv / span * 100 * def.act;
  if (c.y1 == null) c.y1 = y;
  if (c.mode === 'AUTO') {

    c.ef = c.ef == null ? ds : c.ef + (ds - c.ef) * Math.min(1, dt / tf);
    const f1 = c.f1 == null ? c.ef : c.f1, f2 = c.f2 == null ? f1 : c.f2;
    const dP = def.ppv ? y - c.y1 : e - c.e1;

  p.mpP = lag(p.mpP == null ? 10 : p.mpP, util.mp ? 10 : 0.3, 60, dt);
  p.hpP = lag(p.hpP == null ? 40 : p.hpP, util.hp ? 40 : 1, 60, dt);
  p.cwS = lag(p.cwS == null ? 32 : p.cwS, util.cw ? 32 + 0.3 * N.air : 45, 120, dt);
  p.fgH = lag(p.fgH == null ? 4.5 : p.fgH, F.fgFail ? 0.1 : 4.5 * (1 + N.fg), 40, dt);

  p.xBH = lag(p.xBH, C['HIC-002'].op / 100, 1200, dt);                  // crude arriving at the unit
  const freshW = src === 'CRUDE' ? 1 : 0;
  const cp0 = CDU.crudeProps(p.xBH);
  p.crude = cp0;

  /* ===== AREA 100 — preheat & desalting ===== */
  const run6001 = E.P6001, run1101 = E.P1101, normal = S.circ === 'NORMAL';
  const dsal = E.DSAL;
  // mixing valves ΔP and the flow into the desalters
  // instructor 'fails in AUTO': the output ramps regardless of the PV (operator must take the loop to MAN)
  const failAuto = (tag, f, rate) => { if (f && C[tag].mode === 'AUTO') { C[tag].pv = tag === 'PIC-011' ? p.Pd : tag === 'LIC-003' ? p.L1 : p.P1103; C[tag].op = clamp(C[tag].op + rate * dt, 0, 100); return true; } return false; };
  if (!failAuto('PIC-011', F.pic011Fail, 0.05)) pidStep(C['PIC-011'], D['PIC-011'], p.Pd, dt);

    const fT = clamp(1 - 0.012 * pos(118 - p.Tdes) - 0.012 * pos(p.Tdes - 152), 0.3, 1);

  const ffin = clamp(p.Fin / 810, 0, 1.4), ffH = clamp(p.F / 810, 0, 1.4);

  p.Flpg = lag(p.Flpg, E.P1115 ? CDU.eqpct(C['FQIC-037'].op, SPAN.FV037) * clamp(p.L1104 / 4, 0, 1) : 0, 5, dt);
  p.L1104 = clamp(p.L1104 + (Vc - p.Rst - p.Flpg) / 10 * 100 * dt / 3600, 0, 100);
  // stabilizer pressure (D-1104, 3-way split range)
  pidStep(C['PIC-068'], D['PIC-068'], p.P1104, dt);
  const o68 = C['PIC-068'].op, nc = p.Fsf > 1 ? 0.06 + 0.06 * lpgF : 0;
  p.pad68 = pos(33 - o68) / 33 * SPAN.PV068A;
  p.og68R = clamp((o68 - 33) / 34, 0, 1) * SPAN.PV068B * (F.rfccTrip ? 0 : 1);
  p.og68F = pos(o68 - 67) / 33 * SPAN.PV068C;
  p.P1104 = clamp(p.P1104 + (nc + uncS + p.pad68 - p.og68R - p.og68F) * 0.004 * dt, 0, 14);
  p.Pst = p.P1104 + 0.3;
  // bottom temperature, top temperature and product quality of the stabilizer
  const Tbs = p.Fsf > 5 ? 188 + 14 * Math.log(clamp(sS, 0.05, 5)) + 4 * (p.Pst - 7.9) : (Qrs > 0.2 ? 245 : p.Tst);
  p.Tst = lag(p.Tst, Math.min(Tbs, 248), 600, dt);
  if (p.Fsf <= 5 && Qrs <= 0.2) p.Tst = lag(p.Tst, p.Tair, 14400, dt);
  p.Ttst = lag(p.Ttst, p.Vst > 1 ? 66 + 15 * clamp(1 - p.Rst / Math.max(Rneed, 3), -0.4, 2.5) + 3 * (p.Pst - 7.9) : p.Tair, 300, dt);
  const strip = 1 - 0.5 * Math.exp(-3 * sS);
  p.lpgAvail = lpgF * strip;
  // bottoms level and naphtha rundown (LIC-042 split range)
  pidStep(C['LIC-042'], D['LIC-042'], p.Lst, dt);
  const o42 = C['LIC-042'].op;
  p.Fnap = Math.min(o42, 50) / 50 * SPAN.FV040 * clamp(p.Lst / 4, 0, 1);
  p.FnapSto = pos(o42 - 50) / 50 * SPAN.LV045 * clamp(p.Lst / 4, 0, 1);
  p.Lst = clamp(p.Lst + (p.Fsf - (p.Vst - p.Rst) + 0 - p.Fnap - p.FnapSto) / 18 * 100 * dt / 3600, 0, 100);

  /* ===== AREA 500 — dryers / vacuum, product coolers ===== */
  pidStep(C['PIC-049'], D['PIC-049'], p.Pdry, dt);
  p.Pdry = lag(p.Pdry, E.EJ && mpOK > 0.5 ? -0.98 + 0.16 * C['PIC-049'].op / 100 : 0.02, 60, dt);
  p.ppmW = 40 * Math.exp(12 * (p.Pdry + 0.9)) * (p.Fin > 50 ? 1 : 0.3);
  p.Tkero = lag(p.Tkero, p.Fkero > 1 ? 40 + 0.5 * (p.Tair - 30) + (util.cw ? 0 : 25) : p.Tair, 300, dt);
  p.Tlgo = lag(p.Tlgo, p.Flgo > 1 ? 55 + 0.6 * (p.Tair - 30) : p.Tair, 300, dt);
  p.Thgo = lag(p.Thgo, p.Fhgo > 1 ? 55 + 0.4 * (p.Tair - 30) + (util.cw ? 0 : 30) : p.Tair, 300, dt);
  p.Tnap = lag(p.Tnap, p.Fnap + p.FnapSto > 1 ? 40 + 0.5 * (p.Tair - 30) + (util.cw ? 0 : 20) : p.Tair, 300, dt);

  // fouling of the preheat train (antifoulant / desalting) and overhead (salts)
  p.foulPre = clamp((p.foulPre || 0) + (p.salt > 3 ? 0.02 * (p.salt - 3) : 0) * dt / 3600, 0, 30);

  CDU.relief(S, dt);
  CDU.props(S, dt);
  CDU.sis(S, dt);
};

/* ---------------- 6. PROCESS NOISE (Ornstein-Uhlenbeck drifts) ----------------
   [sigma, tau s]: tbp °C shift of the crude curve, air °C, fuel-gas heating value, salt, free water,
   feed-pump flow, tank temperature °C, branch ΔT drift, fuel-gas header.                             */
CDU.gauss = () => { let u = 0; while (!u) u = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * Math.random()); };
const NZ = { tbp: [0.8, 1800], air: [0.8, 1800], lhv: [0.008, 600], salt: [0.08, 1200], wat: [0.08, 900], ff: [0.002, 60], tf: [0.6, 1800], br7: [0.5, 1500], br15: [0.5, 1500], fg: [0.008, 300] };
CDU.noise = function (S, dt) {
  const on = S.noiseOn !== false; CDU.mnoise = on;
  const n = S.nz || (S.nz = {});
  for (const k in NZ) {
    const [sig, tau] = NZ[k], x = n[k] || 0;
    n[k] = on ? x - x * dt / tau + sig * Math.sqrt(2 * dt / tau) * CDU.gauss() : x * (1 - Math.min(1, dt / 60));
  }
  n.aird = on ? 3.5 * Math.sin(S.t * 2 * Math.PI / 86400) : 0;   // ±3.5 °C day / night ambient
};

/* ---------------- 7. PRESSURE RELIEF & FLARE ----------------

CDU.PSV = {

  'PSV-161': { d: 'T-1101 overhead vapour relief valves PSV-161/162/163/165/166 (5 × spring)', p: 'Ptop', st: 'P1103', set: 3.5, reseat: 3.15, cap: 160, k: 0.0008, to: 'flare', page: 'fract' },
  'PSV-237': { d: 'T-1107 stabilizer overhead relief PSV-237/238', p: 'Pst', st: 'P1104', set: 9.6, reseat: 8.9, cap: 40, k: 0.004, to: 'flare', page: 'overhead' }
};
CDU.PSV_STATIC = {
  'PSV-172': ['Desalter A-1101-D-02 relief (pilot) to T-1101', 'preheat', '13.8 kg/cm²g'],
  'PSV-085': ['H-1101 superheated steam coil relief PSV-085/086', 'heater', '6.3 kg/cm²g'],
  'PSV-170': ['D-1106 sour-water / oil separator relief PSV-170/171 to flare', 'overhead', '11 kg/cm²g'],
  'PSV-021': ['T-1105 LGO dryer relief to flare', 'rundown', '3.5 kg/cm²g'],
  'PSV-106': ['T-1106 HGO dryer relief PSV-106/107 to flare', 'rundown', '3.5 kg/cm²g'],
  'PSV-131': ['D-1114 fuel-gas drum relief PSV-131/132 to flare', 'utilities', '6.7 kg/cm²g'],
  'PSV-175': ['HP steam relief PSV-175/176 (stabilizer reboiler supply)', 'utilities', '27.2 kg/cm²g'],
  'PSV-239': ['D-1109 desalter water surge drum relief', 'preheat', '2.7 kg/cm²g'],
  'TSV-310': ['Thermal reliefs on the preheat exchangers (TSV-308…315)', 'preheat', '37.7–37.9 kg/cm²g'],
  'TSV-319': ['Tempered water thermal relief E-1120 C/D', 'utilities', '22.7 kg/cm²g']
};
CDU.relief = function (S, dt) {
  const p = S.p; S.psv = S.psv || {};
  let load = 0; p.psvD = 0;
  for (const tag in CDU.PSV) {
    const v = CDU.PSV[tag], st = S.psv[tag] || (S.psv[tag] = { open: false, n: 0, f: 0 }), P = p[v.p];
    if (!st.open && P >= v.set) {
      st.open = true; st.n++; st.t = S.t;
      CDU.log(S, 'SIS', tag + ' LIFTED at ' + P.toFixed(2) + ' kg/cm²g (set ' + v.set + ') — relieving to ' + (v.to === 'flare' ? 'flare' : 'T-1101'));
      CDU.alert(S, 'psv', tag, tag + ' LIFTED — relieving to ' + (v.to === 'flare' ? 'the flare' : 'T-1101'), v.d + ' opened at ' + P.toFixed(2) + ' kg/cm²g (set pressure ' + v.set + '). Find and remove the cause of the overpressure.');
    } else if (st.open && P <= v.reseat) { st.open = false; CDU.log(S, 'SIS', tag + ' reseated at ' + P.toFixed(2) + ' kg/cm²g'); }
    st.f = st.open ? v.cap * clamp(0.35 + 0.65 * (P - v.reseat) / (v.set - v.reseat), 0.2, 1) : 0;
    if (st.f > 0) { const k = v.st || v.p; p[k] = Math.max(0, p[k] - st.f * v.k * dt); }

  p.flare = lag(p.flare || 0.5, 0.5 + load + p.flareCtl + p.fb, 8, dt);   // 0.5 t/h purge + sweep gas
  p.flareCap = 250;

CDU.flareBurst = function (S, tph) { S.p.fb = Math.min(120, (S.p.fb || 0) + tph); };
CDU.alert = function (S, kind, tag, title, msg) {
  S.alerts = S.alerts || []; S.alertSeq = (S.alertSeq || 0) + 1;
  S.alerts.unshift({ id: S.alertSeq, t: S.t, kind, tag, title, msg, closed: false });
  if (S.alerts.length > 30) S.alerts.length = 30;
};
CDU.tripEq = function (S, eq, why) {
  if (!S.eq[eq] && S.trip && S.trip[eq]) return;
  S.eq[eq] = false; S.trip = S.trip || {}; S.trip[eq] = { t: S.t, why };
  const nm = (CDU.EQ[eq] && CDU.EQ[eq].d) || eq;
  CDU.alert(S, 'trip', eq, 'TRIP — ' + nm, why);
};

/* ---------------- 8. PRODUCT QUALITY ---------------- */
CDU.props = function (S, dt) {
  const p = S.p, cr = p.crude, E = S.eq;
  p.inst = p.inst || {}; p.lab = p.lab || {};
  const I = p.inst;
  if (p.Fc > 100 && p.wC > 0.5) {
    const gNK = 6 + 20 * Math.log(Math.max(p.r1, 0.05)), gKL = 4 + 18 * Math.log(Math.max(p.r2, 0.05));
    const oLH = 12 - 15 * Math.log(Math.max(p.r3, 0.05)) + 8 * pos(1.5 - p.OF);
    const liftK = 10 * (1 - Math.exp(-1.2 * p.Qreb / 2.9)) / (1 - Math.exp(-1.2));
    const liftL = 20 * (1 - Math.exp(-1.5 * p.St2 / Math.max(5.07 * p.Flgo / 170.8, 0.3))) / (1 - Math.exp(-1.5));
    const liftH = 12 * (1 - Math.exp(-1.5 * p.St3 / Math.max(2.6 * p.Fhgo / 69.8, 0.2))) / (1 - Math.exp(-1.5));
    const nap95 = p.cutNK - 4 - gNK / 2, kero5 = p.cutNK - 4 + gNK / 2 + liftK;
    const kero95 = p.cutKL - 3 - gKL / 2, lgo5 = p.cutKL - 3 + gKL / 2 + liftL;
    const lgo95 = p.cutLH - 3 + oLH / 2, hgo5 = p.cutLH - 3 - oLH / 2 + liftH;
    I.N95 = nap95; I.GNK = gNK + 0.3 * liftK; I.GKL = gKL + 0.3 * liftL; I.OLH = oLH;
    I.KFL = 0.72 * kero5 - 79; I.LFL = 0.72 * lgo5 - 85; I.HFL = 0.72 * hgo5 - 85;
    I.FRZ = cr.fz0 + 0.55 * (kero95 - 197);
    I.SMK = cr.smk0 - 0.15 * (kero95 - 199) + 0.1 * (p.cutNK - 165);
    I.DEN = cr.den0 + 0.0006 * ((p.cutNK + p.cutKL) / 2 - 185);
    I.POUR = cr.p0 + 0.45 * (lgo95 - 320);
    I.CET = cr.cet0 + 0.08 * ((p.cutKL + p.cutLH) / 2 - 267.5);
    I.H2O = p.ppmW;
    I.CCR = 0.08 + 0.35 * Math.pow(pos(2 - p.OF), 2) + 0.02 * pos(p.cutHR - 380);
    I.R360 = 6 * Math.exp(-clamp((p.cutHR - 370) / 15, -3, 2.5)) * Math.pow(16 / Math.max(p.St1, 0.8), 0.35) * (1 + 0.5 * pos(1.5 - p.OF));
  } else if (p.Fc > 50) {     // flushing oil in the column: products are not representative (all to slops)
    Object.assign(I, { GNK: -10, KFL: 30, LFL: 50, POUR: 15, R360: 25, CCR: 0.5, OLH: 30 });
  }
  // stabilizer
  if (p.Fsf > 5) {
    I.C5 = 0.8 * Math.exp(clamp((p.Ttst - 66) / 5, -3, 4)) + 5 * pos(p.Flpg - p.lpgAvail) / Math.max(p.Flpg, 0.2);
    I.C4N = 0.12 * Math.exp(-clamp((p.Tst - 188) / 6, -4, 4)) * Math.pow(Math.max(p.zLPG, 0.002) / 0.02, 0.3) + 20 * pos(p.lpgAvail - p.Flpg) / Math.max(p.Fnap + p.FnapSto, 20);
  } else if (p.Fc > 50) { I.C5 = 3; I.C4N = 1.0; }
  for (const k in CDU.PROPS) {
    if (I[k] == null) continue;
    if (p.lab[k] == null) p.lab[k] = I[k];
    p.lab[k] = lag(p.lab[k], I[k], 600, dt);     // product tank / sample point lag
  }
  // product-by-product spec check and tonnage accounting
  const g = CDU.GRADES[S.target], ok = {};
  for (const pr in CDU.PRODUCTS) ok[pr] = true;
  for (const k in g.spec) { const v = p.lab[k], [lo, hi] = g.spec[k]; if (v == null || v < lo || v > hi) ok[CDU.PROPS[k].prod] = false; }
  p.ok = ok;
  const flows = { LPG: p.Flpg, NAP: p.Fnap + p.FnapSto, KERO: p.Fkero, LGO: p.Flgo, HGO: p.Fhgo, RES: p.FresProd };
  const rmap = { LPG: 'NAP', NAP: 'NAP', KERO: 'KERO', LGO: 'LGO', HGO: 'HGO', RES: 'RES' };
  let all = true;
  for (const pr in flows) {
    const t = pos(flows[pr]) * dt / 3600, slop = S.route[rmap[pr]] === 'SLOPS';
    const rec = S.prodTons[pr] || (S.prodTons[pr] = { on: 0, off: 0, slop: 0 });
    if (slop) { rec.slop += t; S.tons.slop += t; } else if (ok[pr]) { rec.on += t; S.tons.on += t; } else { rec.off += t; S.tons.off += t; }
    if (!ok[pr]) all = false;
  }
  p.allOk = all && p.Fc > 100;
  p.pelOk = p.allOk;
};
CDU.inSpec = function (props, grade) {
  const g = CDU.GRADES[grade], r = { all: true };
  if (!g) return r;
  for (const k in g.spec) { const [lo, hi] = g.spec[k]; const v = props[k]; const ok = v != null && v >= lo && v <= hi; r[k] = ok; if (!ok) r.all = false; }
  return r;

/* ---------------- 9. SAFETY INSTRUMENTED SYSTEM ----------------
   UX-007 CDU emergency shutdown (manual) · UX-001 desalter protection · UX-005A heater trip ·
   UX-005B fuel-gas trip · UX-005E pilot-gas trip · UX-020 / 002 / 022 / 024 inventory protections.  */
CDU.SIS_DESC = {
  'UX-007': 'CDU emergency shutdown (manual push button): stops P-6001 and P-1101, trips H-1101, cuts stripping steam, de-energises the desalters',
  'UX-001': 'Desalter protection: PZHH-011 desalter pressure ≥ 13.5 kg/cm²g or LZLL desalter level (pressure < 1.0): transformers off, P-1118/P-1119 stop, initiates UX-005B',
  'UX-005A': 'Heater trip: both FD fans B-1101 A/B stopped or UX-007: all fuel and pilots isolated',
  'UX-005B': 'Fuel-gas trip: FZLL-010 A/B/C charge < 30 % (243 t/h) 2oo3, PZLL burner pressure < 0.15 kg/cm²g, TZHH-066 COT ≥ 390 °C, UX-005A, UX-001',
  'UX-005E': 'Pilot-gas trip: PZLL-112 pilot gas pressure low-low: pilots and main burners isolated',
  'UX-020': 'P-1106 residue pump protection: LZLL-007 T-1101 bottoms ≤ 5 %',
  'UX-002': 'T-1101 inventory protection: LZHH-007 bottoms ≥ 95 % stops P-6001 and P-1101 (charge cut) (a)',
  'UX-022': 'P-1110 protection: LZLL-038 D-1103 naphtha ≤ 5 % (a)',
  'UX-024': 'D-1104 LZHH-047 ≥ 90 %: stabilizer reboiler steam FV-060 closed (a)'
};
CDU.heaterTrip = function (S, ux, why) {
  const s = S.sis, E = S.eq;
  if (!E.BURN && !E.PILOT && s.htrTrip) return;
  if (s.bypass && ux !== 'UX-007') { if (s.lastTrip !== why) { s.lastTrip = why; CDU.log(S, 'SIS', 'BYPASSED trip demand ' + ux + ': ' + why); } return; }
  const wasLit = E.BURN || E.PILOT;
  if (ux !== 'UX-005B' || true) { E.BURN = false; if (ux !== 'UX-005B') E.PILOT = false; }
  s.htrTrip = true; s.purge = 0; s.lastTrip = why;
  S.ctl['TIC-066'].mode = 'MAN'; S.ctl['TIC-066'].op = 0;
  CDU.log(S, 'SIS', ux + ' H-1101 TRIP — ' + why);
  if (wasLit) CDU.alert(S, 'sis', 'H-1101', 'SIS TRIP ' + ux + ' — HEATER H-1101 FUEL ISOLATED', why + '. COT falls; reduce charge (FIC-069) and check T-1101 temperatures. Remove the cause, RESET on the heater faceplate (UHSR-005), purge 5 min with B-1101 running, relight pilots then burners.');
};
CDU.sis = function (S, dt) {
  const p = S.p, s = S.sis, E = S.eq;
  const demand = (key, why, act) => {
    if (s.cut[key]) return;
    if (s.bypass) { if (s.lastTrip !== why) { s.lastTrip = why; CDU.log(S, 'SIS', 'BYPASSED trip demand: ' + why); } return; }
    s.cut[key] = true; s.lastTrip = why; act(); CDU.log(S, 'SIS', why);
  };
  // UX-001 desalter protection
  if (E.DSAL && (p.Pd >= 13.5 || (p.Pd < 1.0 && S.circ === 'NORMAL' && p.F > 100))) demand('ux001', 'UX-001 desalter protection: ' + (p.Pd >= 13.5 ? 'PZHH-011 pressure ' + p.Pd.toFixed(2) + ' kg/cm²g' : 'LZLL desalter level (pressure lost)'), () => {
    E.XFMR = false; E.P1118 = false; E.P1119 = false; CDU.heaterTrip(S, 'UX-005B', 'UX-001 desalter protection');
    CDU.alert(S, 'sis', 'UX-001', 'SIS TRIP UX-001 — DESALTER PROTECTION', 'Desalter ' + (p.Pd >= 13.5 ? 'pressure high-high' : 'level low-low') + '. Transformers, wash and recycle water stopped and H-1101 fuel tripped. Stabilise PIC-011 / charge, then reset on the instructor or desalter faceplate.');
  });
  if (s.cut.ux001 && p.Pd < 13.0 && p.Pd > 2) { /* waits for manual reset */ }
  // heater
  if (E.BURN || E.PILOT) {
    if (!E.B1101) CDU.heaterTrip(S, 'UX-005A', 'FD fans B-1101 A/B stopped');
    else if (E.BURN && S.circ === 'NORMAL' && p.F < 243 && S.t - (s.lightT || 0) > 30) CDU.heaterTrip(S, 'UX-005B', 'FZLL-010 charge flow < 243 t/h (low pass flow)');
    else if (E.BURN && S.circ !== 'NORMAL' && p.F < 243 && S.t - (s.lightT || 0) > 30) CDU.heaterTrip(S, 'UX-005B', 'FZLL-010 circulation flow < 243 t/h (low pass flow)');
    else if (E.BURN && p.Pburn < 0.15 && S.t - (s.lightT || 0) > 20) CDU.heaterTrip(S, 'UX-005B', 'PZLL burner fuel-gas pressure < 0.15 kg/cm²g');
    else if (E.BURN && p.COT >= 390) CDU.heaterTrip(S, 'UX-005B', 'TZHH-066 coil outlet ≥ 390 °C');
    else if (E.PILOT && p.pilotP < 0.3) CDU.heaterTrip(S, 'UX-005E', 'PZLL-112 pilot gas pressure low-low');
  }

  // inventory protections
  if (E.P1106 && p.Lbot <= 5) demand('ux020', 'UX-020 LZLL-007 T-1101 bottoms ≤ 5 % — P-1106 stopped', () => { CDU.tripEq(S, 'P1106', 'UX-020: T-1101 bottoms level low-low (≤ 5 %) — pump protection. Restore the level (reduce draws / residue rundown) before restart.'); });
  if (s.cut.ux020 && p.Lbot > 8) s.cut.ux020 = false;
  if (E.P1101 && p.Lbot >= 95) demand('ux002', 'UX-002 LZHH-007 T-1101 bottoms ≥ 95 % — charge pumps P-6001 and P-1101 stopped (charge cut)', () => { E.P6001 = false; CDU.tripEq(S, 'P1101', 'UX-002: T-1101 bottoms level high-high (≥ 95 %). Charge cut to protect the flash zone and stripping section. Lower the level (residue pump / LIC-007) before restart.'); });
  if (s.cut.ux002 && p.Lbot < 85) s.cut.ux002 = false;
  if (E.P1110 && p.L1103 <= 5) demand('ux022', 'UX-022 LZLL-038 D-1103 naphtha ≤ 5 % — P-1110 stopped', () => { CDU.tripEq(S, 'P1110', 'UX-022: D-1103 naphtha level low-low. Restart P-1110 when the level is back above 20 %.'); });
  if (s.cut.ux022 && p.L1103 > 10) s.cut.ux022 = false;
  if (p.L1104 >= 90) demand('reb', 'UX-024 LZHH-047 D-1104 ≥ 90 % — stabilizer reboiler steam FV-060 closed', () => {
    CDU.alert(S, 'sis', 'TIC-060', 'SIS TRIP UX-024 — STABILIZER REBOILER STEAM CUT', 'D-1104 reflux drum level high-high: HP steam to E-1121 closed. Check reflux pump P-1114 and LIC-047, lower the level, then reset on the TIC-060 faceplate.');
  });
};

/* ---------------- 10. RECIPE SOLVER ----------------
   Computes the SPs for an operating case: the top temperature for the naphtha/kero cut, product draws
   for the side cuts, COT for 2.5 % overflash, stripping steam in proportion to the product flows.      */
CDU.solveRecipe = function (grade) {
  const g = CDU.GRADES[grade], x = g.bh / 100, F = g.feed, [c1, c2, c3, c4] = g.cuts;
  const y = (T) => CDU.cum(x, 1, T);
  const lpg = y(30) / 100 * F, nap = (y(c1) - y(30)) / 100 * F;
  const kero = (y(c2) - y(c1)) / 100 * F, lgo = (y(c3) - y(c2)) / 100 * F, hgo = (y(c4) - y(c3)) / 100 * F, res = F - lpg - nap - kero - lgo - hgo;
  const Teff = CDU.icum(x, 1, y(c4) + 2.5);
  const COT = Teff - 33 + 6;
  const Ttop = 123.6 + (c1 - 165) / 0.833;

/* ---- start-up / shutdown procedure tracker (book §8.2 / §8.3, Fig. p.250-254) ----

const RC = (S) => CDU.solveRecipe(S.target), auto = (S, t) => S.ctl[t].mode === 'AUTO';

CDU.procEval = function (S) {
  const pr = S.proc; if (!pr || pr.complete != null) return;
  const steps = CDU.PROCS[pr.id].steps;
  while (pr.i < steps.length) {

    if (!ok) break;

  }
  if (pr.i >= steps.length) {

    CDU.log(S, 'PROCEDURE', CDU.PROCS[pr.id].title + ' COMPLETE in ' + fmtT(S.t - pr.t0) + ' · off-spec ' + S.tons.off.toFixed(0) + ' t · slops ' + S.tons.slop.toFixed(0) + ' t · SIS events ' + pr.trips + ' · ' + (pr.easyUsed || S.level !== 'hard' ? 'EASY (recipe hints used)' : 'HARD mode'));

CDU.startSession = function (c, prev) {

  else if (c.mode === 'startup') {
    S = CDU.initCold(c.grade, prev);
    S.session = { mode: 'startup', title: 'Full unit start-up from cold — ' + c.grade, brief: 'Unit empty, inerted, all equipment stopped at 25 °C. Charge flushing oil, circulate, fire the heater, introduce crude and bring the unit to design rate and on-spec. Follow the step tracker (manual §8).' };
    S.proc = { id: 'startup', i: 0, done: [], t0: 0, complete: null };
  } else if (c.mode === 'shutdown') {
    S = CDU.initSteady(c.grade, prev);
    S.session = { mode: 'shutdown', title: 'Controlled unit shutdown — ' + c.grade, brief: 'Unit at steady state. Bring it down safely to an empty, cold, pressurised condition. Follow the step tracker (manual §9).' };
    S.proc = { id: 'shutdown', i: 0, done: [], t0: 0, complete: null };

/* ---------------- 5. SHARED-STATE RUNTIME ----------------
   Every page runs the same simulation. One page (the "leader") integrates the model and
   saves state to localStorage (+ window.name as same-tab fallback); other open pages follow
   and send their operator actions through a command queue.                           */
const KEY = 'cdusim.state', LKEY = 'cdusim.leader', QKEY = 'cdusim.cmdq', SNAP = 'cdusim.snap';
const rt = CDU.rt = { id: Math.random().toString(36).slice(2), leader: false, S: null, last: Date.now(), lastSave: 0, lastLoad: 0, ls: true, listeners: [] };
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { rt.ls = false; return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { rt.ls = false; return false; } }
function parse(s) { try { return JSON.parse(s); } catch (e) { return null; } }
function loadState() {
  let a = parse(lsGet(KEY)), b = null;
  if (typeof window.name === 'string' && window.name.startsWith('CDUSIM:')) b = parse(window.name.slice(7));
  let S = a; if (b && (!a || (b.savedAt || 0) > (a.savedAt || 0))) S = b;
  if (S && S.v === 1 && S.p && S.p.pass) return CDU.upgradeState(S);
  return null;
}
function saveState() {
  const S = rt.S; if (!S) return; S.savedAt = Date.now();
  const j = JSON.stringify(S); lsSet(KEY, j);
  try { window.name = 'CDUSIM:' + j; } catch (e) { }
  rt.lastSave = Date.now();
}
CDU.save = saveState;
function becomeLeader() {
  rt.leader = true;
  let S = loadState();
  if (!S) { S = CDU.initSteady('BACH HO'); }
  else if (!S.frozen && S.savedAt) { const real = Math.max(0, (Date.now() - S.savedAt) / 1000); CDU.advance(S, Math.min(real * S.speed, 7200)); }
  rt.S = S; rt.last = Date.now(); saveState();
}
// code version: a tab running newer simulator code always takes over from a tab with older code
CDU.CODE_VER = 100;
function heartbeat() { lsSet(LKEY, JSON.stringify({ id: rt.id, ts: Date.now(), ver: CDU.CODE_VER })); }
function drainQueue() {
  const q = parse(lsGet(QKEY)); if (!q || !q.length) return; lsSet(QKEY, '[]');
  for (const c of q) runCmd(c);
}
function runCmd(c) {
  const S = rt.S, lvl = c.level || (S && S.level) || 'easy';
  runCmd0(c, S);
  // a new plant (session, exercise, re-init, snapshot) keeps the chosen difficulty
  if (rt.S && rt.S !== S) {
    rt.S.level = lvl === 'hard' ? 'hard' : 'easy';
    if (rt.S.proc) rt.S.proc.easyUsed = rt.S.level !== 'hard';
    if (c.level) CDU.log(rt.S, 'INSTRUCTOR', 'Difficulty: ' + rt.S.level.toUpperCase());
  }
}
function runCmd0(c, S) {
  if (c.type === 'reinit') { rt.S = CDU.initSteady(c.grade, S); rt.S.session = { mode: 'steady', title: 'Normal operation — steady state ' + c.grade, brief: '' }; CDU.log(rt.S, 'INSTRUCTOR', 'Re-initialised (grade ' + c.grade + ')'); return; }
  if (c.type === 'session') { rt.S = CDU.startSession(c, S); return; }
  if (c.type === 'exercise') { const ex = CDU.EXERCISES.find(e => e.id === c.id); if (ex) rt.S = CDU.startExercise(ex, S); return; }
  if (c.type === 'snapSave') { const j = JSON.stringify(S); lsSet(SNAP, j); CDU.log(S, 'INSTRUCTOR', 'Snapshot saved at ' + fmtT(S.t)); return; }
  if (c.type === 'snapRestore') { const s = parse(lsGet(SNAP)); if (s) { rt.S = s; CDU.log(s, 'INSTRUCTOR', 'Snapshot restored'); } return; }
  CDU.exec(S, c);
}
CDU.cmd = function (c) {
  if (rt.leader || !rt.ls) { runCmd(c); saveState(); CDU.render(); }
  else { const q = parse(lsGet(QKEY)) || []; q.push(c); lsSet(QKEY, JSON.stringify(q)); }
};
function tick() {
  const now = Date.now();
  if (!rt.leader) {
    const L = parse(lsGet(LKEY));
    rt.outdated = !!(L && (L.ver || 0) > CDU.CODE_VER);   // another tab runs newer code → this one should be reloaded
    if (!rt.ls || !L || now - L.ts > 1500 || L.id === rt.id || (L.ver || 0) < CDU.CODE_VER) becomeLeader();
  }
  if (rt.leader) {
    const L = parse(lsGet(LKEY));
    if (rt.ls && L && L.id !== rt.id && now - L.ts < 1500 && L.ts > rt.lastBeat && (L.ver || 0) >= CDU.CODE_VER) { rt.leader = false; }   // another tab took over
  }
  if (rt.leader) {
    heartbeat(); rt.lastBeat = Date.now(); rt.outdated = false; drainQueue();
    const S = rt.S, real = Math.min(1, (now - rt.last) / 1000);
    if (!S.frozen) {
      CDU.advance(S, real * S.speed);
    }
    if (now - rt.lastSave > 1000) saveState();
  } else if (now - rt.lastLoad > 500) { const S = loadState(); if (S) rt.S = S; rt.lastLoad = now; }
  rt.last = now;
  CDU.render();
}
CDU.render = function () { for (const f of rt.listeners) { try { f(rt.S); } catch (e) { console.error(e); } } };
CDU.onRender = (f) => rt.listeners.push(f);
CDU.start = function () {
  becomeLeaderOrFollow();
  setInterval(tick, 250);
  window.addEventListener('pagehide', () => { if (rt.leader) { saveState(); lsSet(LKEY, JSON.stringify({ id: '', ts: 0 })); } });
};
function becomeLeaderOrFollow() {
  const L = parse(lsGet(LKEY));
  if (!rt.ls || !L || Date.now() - L.ts > 1500) becomeLeader();
  else { rt.S = loadState() || CDU.initSteady('BACH HO'); }
  if (rt.leader) heartbeat();
  rt.lastBeat = Date.now();
  CDU.render();
}
})(window);

</script>

const fx = (v, d) => (v == null || isNaN(v)) ? '—' : (+v).toFixed(d == null ? 1 : d);
UI.h = h; UI.fx = fx; UI.$ = $;

/* ---------------- 1. PAGES ---------------- */
UI.PAGES = [
  ['index', 'Overview'], ['preheat', '100 Preheat & Desalting'], ['heater', '200 Crude Heater'], ['fract', '300 Main Fractionator'], ['overhead', '400 Overhead & Stabilizer'],
  ['rundown', '500 Rundown & Dryers'], ['utilities', '900 Utilities & Flare'], ['trends', 'Trends'], ['alarms', 'Alarms & Journal'], ['quality', 'Quality / Products'], ['instructor', 'Instructor'], ['manual', 'Manual']
];
// Page addresses. In the single-file offline version (window.CDU_SINGLE) every page lives in one HTML file
// and is chosen with ?p=<page>; documents (PDFs, printable forms) then open from the online site.
UI.ONLINE = 'https://azhartheking.github.io/cdu-dcs/';   // used only once the simulator is published
UI.href = (id, tag) => (window.CDU_SINGLE ? '?p=' + id : id + '.html') + (tag ? '#' + encodeURIComponent(tag) : '');
UI.resolve = (h) => {
  if (!window.CDU_SINGLE || !h) return h;
  if (/^(docs|forms)\//.test(h)) return 'cdu/' + h;   // the single file sits next to the cdu/ folder (project folder and share folder)
  const m = /^([\w-]+)\.html(\?[^#]*)?(#.*)?$/.exec(h);
  return m ? '?p=' + m[1] + (m[2] ? '&' + m[2].slice(1) : '') + (m[3] || '') : h;
};
if (window.CDU_SINGLE) document.addEventListener('click', (e) => {
  const a = e.target.closest && e.target.closest('a[href]'); if (!a) return;
  const h = a.getAttribute('href'), r = UI.resolve(h);
  if (r !== h) { e.preventDefault(); if (/^https?:/.test(r)) window.open(r, '_blank'); else location.href = r; }
}, true);
// which page owns each tag (for cross-page jumps)
UI.TAGPAGE = {};
for (const t in CDU.CTL) UI.TAGPAGE[t] = CDU.CTL[t].page;
Object.assign(UI.TAGPAGE, { 'AI-SALT': 'preheat', 'AI-BSW': 'preheat', 'TI-DES': 'preheat', 'HS-001': 'preheat', 'HS-003': 'preheat', 'UX-001': 'preheat', 'UX-007': 'preheat', 'H-1101': 'heater', 'TI-SKIN': 'heater', 'FI-PASS': 'heater', 'PI-123': 'heater', 'TI-SH': 'heater', 'HS-100': 'heater', 'FI-OF': 'fract', 'PI-TOP': 'fract', 'AI-CL': 'overhead', 'AI-PH': 'overhead', 'FV-026': 'rundown', 'LAB': 'quality', 'SIS': 'instructor', 'FL-901': 'utilities', 'D-901': 'utilities', 'PI-FG': 'utilities', 'PI-LPS': 'utilities', 'PI-MPS': 'utilities', 'PI-HPS': 'utilities', 'TI-CW': 'utilities' });
for (const k in CDU.EQ) UI.TAGPAGE[CDU.EQ[k].tag] = CDU.EQ[k].page;
for (const t in CDU.PSV) UI.TAGPAGE[t] = CDU.PSV[t].page;
for (const t in CDU.PSV_STATIC) UI.TAGPAGE[t] = CDU.PSV_STATIC[t][1];
const EQTAG = CDU.EQTAG;
const TAGEQ = {}; for (const k in EQTAG) TAGEQ[EQTAG[k]] = k;
UI.go = (tag) => { const pg = UI.TAGPAGE[tag];
  if (UI.isPop && pg) {   // from a pop-out: show the tag in the main window
    try { if (window.opener && !window.opener.closed) { window.opener.location.href = UI.href(pg, tag); window.opener.focus(); return; } } catch (e) { }
    window.open(UI.href(pg, tag), 'cdu_main'); return;
  } if (pg && pg !== UI.pageId) location.href = UI.href(pg, tag); else UI.select(tag); };

/* ---------------- 3. BINDINGS ---------------- */
const binds = [];
UI.bind = (el, fn) => { binds.push([el, fn]); return el; };
UI.text = (el, fn) => UI.bind(el, (S) => { const v = fn(S); if (el.textContent !== v) el.textContent = v; });
function renderBinds(S) { for (const [el, fn] of binds) fn(S, el); }

/* ---------------- 2. HEADER ---------------- */
function buildHeader() {
  const hd = $('#hdr');
  const r1 = h('div', { class: 'hrow' });
  r1.append(h('div', { class: 'brand' }, 'CDU UNIT 11 · DCS<small>Crude distillation unit training simulator</small>'));
  const grade = h('div', { class: 'chip', title: 'Target operating case (set on Quality / Products)' });
  UI.bind(grade, (S) => { const n = Object.values(S.p.ok || {}).filter(v => !v).length; grade.innerHTML = 'Case <b>' + S.target + '</b> · ' + fx(S.p.F, 0) + ' t/h · products ' + (S.p.allOk ? '<b style="color:var(--ok)">ON-SPEC</b>' : '<b style="color:var(--p1)">' + (S.p.F > 100 ? n + ' OFF-SPEC' : 'NO PRODUCTION') + '</b>'); });
  r1.append(h('a', { class: 'chip np', href: 'https://azhartheking.github.io/plant-simulators/', title: 'Back to the plant selection page (Alkylation · Spherizone PP · CDU)', style: 'text-decoration:none;color:inherit' }, '⌂ All plants'));
  r1.append(grade, h('div', { class: 'spacer' }));
  const role = h('div', { class: 'chip', title: 'Only one open page integrates the model; other open tabs follow it' });
  UI.bind(role, () => { const o = CDU.rt.outdated; role.textContent = o ? '⚠ OLD VERSION — press Ctrl+F5' : CDU.rt.leader ? 'SIM ●' : 'SIM ○ follower'; role.style.background = o ? 'var(--p2)' : ''; role.style.fontWeight = o ? '700' : ''; });
  const clk = h('div', { class: 'clock', title: 'Simulation clock' }); UI.text(clk, (S) => CDU.fmtT(S.t));
  const fr = h('button', { on: { click: () => CDU.cmd({ type: 'freeze', on: !CDU.rt.S.frozen }) } });
  UI.bind(fr, (S) => { fr.textContent = S.frozen ? '▶ RUN' : '❚❚ FREEZE'; fr.classList.toggle('warn', S.frozen); });
  const sp = h('div', { class: 'grp' });
  for (const v of [1, 5, 20, 60]) { const b = h('button', { on: { click: () => CDU.cmd({ type: 'speed', v }) } }, v + '×'); UI.bind(b, (S) => b.classList.toggle('on', S.speed === v)); sp.append(b); }
  const ab = h('a', { class: 'almbadge', href: UI.href('alarms'), title: 'Alarm summary (P1 / P2 / P3)' });
  const a = [1, 2, 3].map(i => { const s = h('span', { class: 'a' + i }, 'P' + i + ' 0'); ab.append(s); return s; });
  UI.bind(ab, (S) => { for (let i = 1; i <= 3; i++) { const act = S.alarms.filter(x => x.prio === i); const un = act.some(x => !x.acked); a[i - 1].textContent = 'P' + i + ' ' + act.length; a[i - 1].classList.toggle('act', act.length > 0); a[i - 1].classList.toggle('blink', un); } });
  const ack = h('button', { on: { click: () => CDU.cmd({ type: 'ack', id: 'ALL' }) }, title: 'Acknowledge all alarms' }, 'ACK ALL');
  const sil = h('button', { on: { click: () => UI.audio.silence() }, title: 'Silence the horn for the current alarms (new alarms sound again)' }, '🔕 SILENCE');
  UI.bind(sil, () => sil.classList.toggle('warn', UI.audio.sounding));
  const snd = h('button', { on: { click: () => UI.audio.toggle() }, title: 'Alarm sound on / off' });
  UI.bind(snd, () => { snd.textContent = UI.audio.on ? '🔊' : '🔇'; snd.classList.toggle('on', !UI.audio.on); });
  const ses = h('button', { on: { click: () => UI.sessionMenu(true) }, title: 'Shift handover — choose normal operation, an upset drill, start-up or shutdown' });
  const SL = { steady: 'NORMAL', drill: 'UPSET DRILL', exercise: 'EXERCISE', startup: 'START-UP', shutdown: 'SHUTDOWN' };
  UI.bind(ses, (S) => { ses.textContent = '☰ SESSION' + (S.session ? ': ' + (SL[S.session.mode] || '') : ''); });
  // difficulty: EASY = recipe hints + one-click buttons, HARD = setpoints from the manual only
  const lvl = h('button', { title: 'Difficulty — EASY: recipe SP hints and one-click buttons · HARD: no hints, setpoints from the manual only' });
  lvl.addEventListener('click', () => {
    const hard = CDU.rt.S.level === 'hard';
    if (hard) { if (!confirm('Switch to EASY mode? Recipe hints will be shown. This is logged in the journal, and a running procedure is then scored as EASY.')) return; }
    else if (!confirm('Switch to HARD mode? Recipe SP hints, "Use recipe" buttons and "Apply recipe SPs" are hidden. Use the manual for every setpoint.')) return;
    CDU.cmd({ type: 'level', v: hard ? 'easy' : 'hard' });
  });
  UI.bind(lvl, (S) => { const hard = S.level === 'hard'; lvl.textContent = hard ? '◆ HARD' : '◇ EASY'; lvl.classList.toggle('on', hard); });
  ses.classList.add('np'); lvl.classList.add('np');   // not shown in pop-out windows
  r1.append(ses, lvl, role, clk, fr, sp, ab, ack, sil, snd);
  const nav = h('nav', { class: 'pages' });
  UI.PAGES.forEach(([id, label], i) => {
    const l = h('a', { href: UI.href(id), title: label + ' (Alt+' + ((i + 1) % 10) + ')' }, label);
    if (id === UI.pageId) l.classList.add('cur');
    const dot = h('span', { class: 'dot' }); l.append(dot);
    UI.bind(dot, (S) => { const al = S.alarms.filter(x => x.page === id && x.active); const p = al.length ? Math.min(...al.map(x => x.prio)) : 0; dot.className = 'dot' + (p ? ' p' + p : '') + (al.some(x => !x.acked) ? ' blink' : ''); });
    nav.append(l);
  });
  hd.append(r1, nav);
  document.addEventListener('keydown', (e) => { if (e.altKey && /^[0-9]$/.test(e.key)) { const i = (+e.key + 9) % 10; if (UI.PAGES[i]) location.href = UI.href(UI.PAGES[i][0]); } });
}

/* ---------------- 4. SVG DRAWING KIT ---------------- */
function kit(svg) {
  const d = { svg };
  const L = { bg: sv('g', {}, svg), pipes: sv('g', {}, svg), eq: sv('g', {}, svg), fg: sv('g', {}, svg) };
  d.layer = L;
  const ptsStr = (p) => p.map(q => q.join(',')).join(' ');
  d.pipe = (pts, cls, opt) => {
    const e = sv('polyline', { points: ptsStr(pts), class: 'pipe ' + (cls || ''), 'marker-end': (opt && opt.noArrow) ? '' : 'url(#arr)' }, L.pipes);
    if (opt && opt.live) UI.bind(e, (S) => e.classList.toggle('dead', !opt.live(S)));
    return e;
  };
  d.rect = (x, y, w, hh, cls, rx) => sv('rect', { x, y, width: w, height: hh, rx: rx || 0, class: cls || 'eq' }, L.eq);
  d.vessel = (x, y, w, hh, label, sub) => {
    const g = sv('g', {}, L.eq); sv('rect', { x, y, width: w, height: hh, rx: Math.min(w / 2, 22), class: 'eq' }, g);
    if (label) d.label(x + w / 2, y + hh + 14, label, 'lbl', 'middle');
    if (sub) d.label(x + w / 2, y + hh + 26, sub, 'lbl s', 'middle');
    return g;
  };
  d.label = (x, y, t, cls, anchor) => { const e = sv('text', { x, y, class: cls || 'lbl', 'text-anchor': anchor || 'start' }, L.fg); e.textContent = t; return e; };
  d.dyn = (x, y, fn, cls, anchor) => { const e = d.label(x, y, '', cls, anchor); UI.text(e, fn); return e; };
  d.level = (x, y, w, hh, fn) => {
    const r = sv('rect', { x, y, width: w, height: 0, class: 'lvl' }, L.eq);
    UI.bind(r, (S) => { const v = Math.max(0, Math.min(100, fn(S))); r.setAttribute('height', hh * v / 100); r.setAttribute('y', y + hh - hh * v / 100); });
    return r;
  };
  d.hx = (x, y, label) => {
    const g = sv('g', {}, L.eq); sv('circle', { cx: x, cy: y, r: 16, class: 'eq2' }, g);
    sv('polyline', { points: `${x - 16},${y} ${x - 9},${y - 8} ${x - 3},${y + 8} ${x + 3},${y - 8} ${x + 9},${y + 8} ${x + 16},${y}`, fill: 'none', stroke: '#53575c', 'stroke-width': 1.4 }, g);
    if (label) d.label(x, y + 30, label, 'lbl', 'middle');
    return g;
  };
  d.motor = (x, y, eq, kind, label) => {
    const g = sv('g', { class: 'motor', 'data-tag': EQTAG[eq] }, L.eq);
    if (kind === 'fan') { sv('circle', { cx: x, cy: y, r: 13, class: 'body' }, g); sv('path', { d: `M${x},${y} L${x - 9},${y - 6} M${x},${y} L${x + 9},${y - 6} M${x},${y} L${x},${y + 10}`, stroke: 'currentColor', 'stroke-width': 2.2, class: 'mk' }, g); }
    else if (kind === 'sw') { sv('rect', { x: x - 14, y: y - 10, width: 28, height: 20, rx: 3, class: 'body' }, g); sv('path', { d: `M${x - 8},${y + 4} L${x + 8},${y - 5}`, stroke: 'currentColor', 'stroke-width': 2, class: 'mk' }, g); }
    else if (kind === 'flame') { sv('rect', { x: x - 14, y: y - 11, width: 28, height: 22, rx: 3, class: 'body' }, g); sv('path', { d: `M${x},${y - 7} Q${x + 7},${y} ${x},${y + 7} Q${x - 7},${y} ${x},${y - 7} Z`, class: 'mk' }, g); }
    else if (kind === 'comp') { sv('path', { d: `M${x - 18},${y - 16} L${x + 18},${y - 8} L${x + 18},${y + 8} L${x - 18},${y + 16} Z`, class: 'body' }, g); sv('circle', { cx: x, cy: y, r: 3, class: 'mk' }, g); }
    else if (kind === 'ext') { sv('rect', { x: x - 40, y: y - 12, width: 80, height: 24, rx: 3, class: 'body' }, g); sv('path', { d: `M${x - 34},${y} L${x + 30},${y}`, stroke: '#888', 'stroke-width': 2 }, g); sv('circle', { cx: x + 30, cy: y, r: 3, class: 'mk' }, g); }
    else if (kind === 'heat') { sv('rect', { x: x - 15, y: y - 13, width: 30, height: 26, rx: 3, class: 'body' }, g); sv('polyline', { points: `${x - 10},${y + 7} ${x - 5},${y - 7} ${x},${y + 7} ${x + 5},${y - 7} ${x + 10},${y + 7}`, fill: 'none', class: 'mk', 'stroke-width': 1.6, stroke: 'currentColor' }, g); }
    else { sv('circle', { cx: x, cy: y, r: 14, class: 'body' }, g); sv('path', { d: `M${x - 6},${y - 8} L${x + 9},${y} L${x - 6},${y + 8} Z`, class: 'mk' }, g); }
    if (label) d.label(x, y + (kind === 'ext' ? 28 : 30), label, 'lbl', 'middle');
    // run-status lamp: green = running, red = stopped, blinking red = tripped
    const lp = { comp: [21, -18], ext: [46, -12], heat: [19, -15], fan: [14, -13], sw: [18, -11], flame: [18, -12] }[kind] || [14, -14];
    const lamp = sv('circle', { cx: x + lp[0], cy: y + lp[1], r: 4.5, class: 'lamp' }, g);
    lamp.appendChild(document.createElementNS(NS, 'title'));
    g.addEventListener('click', () => UI.select(EQTAG[eq]));
    UI.bind(g, (S) => {
      const run = !!S.eq[eq], tripped = !run && !!(S.trip && S.trip[eq]);
      g.classList.toggle('run', run);
      g.classList.toggle('trip', tripped || (!run && !!S.fail[CDU.MOTOR_FAIL[eq]]));
      g.classList.toggle('tripped', tripped);
      lamp.setAttribute('class', 'lamp ' + (run ? 'on' : tripped ? 'tr' : 'off'));
      lamp.firstChild.textContent = run ? 'RUNNING' : tripped ? 'TRIPPED — ' + S.trip[eq].why : 'STOPPED';
      g.classList.toggle('sel', UI.sel === EQTAG[eq]);
    });
    return g;
  };
  // pressure relief valve (PSV / PRV / BDV). dir: 'u' = outlet up, 'r' = outlet right, 'l' = outlet left
  d.psv = (x, y, tag, dir) => {
    const live = !!CDU.PSV[tag], g = sv('g', { class: 'psv' + (live ? '' : ' static'), 'data-tag': tag }, L.fg);
    // inlet at (x, y+12); body bow-tie; spring bonnet on top; outlet to the side
    sv('path', { d: `M${x},${y + 12} L${x},${y + 7}`, class: 'pipe thin', 'marker-end': '' }, g);
    sv('path', { d: `M${x - 6},${y + 7} L${x + 6},${y + 7} L${x},${y - 1} Z`, class: 'pv' }, g);
    const ox = dir === 'l' ? -9 : 9;
    sv('path', { d: `M${x},${y - 1} L${x + ox},${y - 7} L${x + ox},${y + 5} Z`, class: 'pv' }, g);
    sv('polyline', { points: `${x - 3},${y - 3} ${x + 3},${y - 6} ${x - 3},${y - 9} ${x + 3},${y - 12} ${x - 3},${y - 15}`, fill: 'none', stroke: '#45494e', 'stroke-width': 1.1 }, g);
    sv('rect', { x: x - 4, y: y - 18, width: 8, height: 3, fill: '#45494e' }, g);
    const t = sv('text', { x: x + (dir === 'l' ? -12 : 12), y: y + 16, class: 'lbl s', 'text-anchor': dir === 'l' ? 'end' : 'start' }, g); t.textContent = tag;
    const v = sv('text', { x: x + (dir === 'l' ? -12 : 12), y: y + 26, class: 'lbl s', 'text-anchor': dir === 'l' ? 'end' : 'start' }, g);
    g.addEventListener('click', () => UI.select(tag));
    UI.bind(g, (S) => {
      const st = live && S.psv && S.psv[tag], open = !!(st && st.open);
      g.classList.toggle('open', open); g.classList.toggle('sel', UI.sel === tag);
      v.textContent = live ? (open ? 'RELIEVING ' + fx(st.f, 1) + ' t/h' : 'set ' + CDU.PSV[tag].set + ' kg/cm²g') : CDU.PSV_STATIC[tag][2];
      UI.alarmClass(g, S, tag);
    });
    return { x: x + ox, y: y - 1 };   // outlet point for the flare line
  };
  d.valve = (x, y, tag, vert, label, opFn) => {
    const g = sv('g', { class: 'tagbox', 'data-tag': tag }, L.eq);
    const p = vert ? `M${x - 7},${y - 9} L${x + 7},${y - 9} L${x - 7},${y + 9} L${x + 7},${y + 9} Z` : `M${x - 9},${y - 7} L${x - 9},${y + 7} L${x + 9},${y - 7} L${x + 9},${y + 7} Z`;
    const b = sv('path', { d: p, class: 'valve' }, g);
    // valve tag (e.g. TCV-211) and valve position under (or beside) the symbol
    const vt = sv('text', { x: x + (vert ? 11 : 0), y: y + (vert ? -1 : 19), class: 'lbl vtag', 'text-anchor': vert ? 'start' : 'middle' }, g); vt.textContent = label || CDU.FCE[tag] || '';
    const t = sv('text', { x: x + (vert ? 11 : 0), y: y + (vert ? 10 : 29), class: 'lbl s', 'text-anchor': vert ? 'start' : 'middle' }, g);
    g.addEventListener('click', () => UI.select(tag));
    UI.bind(g, (S) => { const c = S.ctl[tag]; const op = opFn ? opFn(S) : (c ? c.op : 0); t.textContent = fx(op, 0) + '%'; b.classList.toggle('open', op > 1); });
    return g;
  };
  d.tag = (x, y, tag, w) => {
    w = w || 118; const def = CDU.CTL[tag];
    const g = sv('g', { class: 'tagbox', 'data-tag': tag, transform: `translate(${x},${y})` }, L.fg);
    sv('rect', { class: 'b', width: w, height: 46, rx: 2 }, g);
    const ab = sv('g', { class: 'ab' }, g); sv('rect', { x: w - 12, y: 3, width: 9, height: 9 }, ab);
    const t1 = sv('text', { x: 5, y: 13, class: 't' }, g); t1.textContent = tag;
    const mb = sv('rect', { x: w - 46, y: 3, width: 31, height: 12, class: 'mbg' }, g);
    const mt = sv('text', { x: w - 30.5, y: 12.5, class: 'm', 'text-anchor': 'middle' }, g);
    const v = sv('text', { x: 5, y: 29, class: 'v' }, g);
    const u = sv('text', { x: w - 5, y: 29, class: 'u', 'text-anchor': 'end' }, g); u.textContent = def.u;
    const s = sv('text', { x: 5, y: 42, class: 's' }, g);
    g.addEventListener('click', () => UI.select(tag));
    UI.bind(g, (S) => {
      const c = S.ctl[tag];
      v.textContent = def.hand ? fx(c.op, 0) : fx(c.pv, def.dec);
      // heater controller with E-212 stopped: standby, not in control (PV is the same R-211 temperature as TIC-211)
      const standby = def.standby && !S.eq[def.standby];
      s.textContent = def.hand ? 'HAND  OP ' + fx(c.op, 0) + '%' : standby ? 'E-212 OFF · standby' : 'SP ' + fx(c.sp, def.dec) + '  OP ' + fx(c.op, 0) + '%';
      mt.textContent = def.hand ? 'HIC' : standby ? 'OFF' : c.mode; mb.style.display = (c.mode === 'AUTO' && !def.hand && !standby) ? 'none' : ''; mt.style.display = mb.style.display;
      g.classList.toggle('standby', !!standby);
      UI.alarmClass(g, S, tag);
      g.classList.toggle('sel', UI.sel === tag);
    });
    return g;
  };
  d.ind = (x, y, label, fn, unit, dec, w, almTag) => {
    w = w || 104;
    const g = sv('g', { class: 'tagbox ind', transform: `translate(${x},${y})` }, L.fg);
    sv('rect', { class: 'b', width: w, height: 32, rx: 2 }, g);
    const ab = sv('g', { class: 'ab' }, g); sv('rect', { x: w - 11, y: 3, width: 8, height: 8 }, ab);
    const t = sv('text', { x: 4, y: 12, class: 't' }, g); t.textContent = label;
    const v = sv('text', { x: 4, y: 27, class: 'v' }, g);
    const u = sv('text', { x: w - 4, y: 27, class: 'u', 'text-anchor': 'end' }, g); u.textContent = unit || '';
    UI.bind(g, (S) => { const r = fn(S); v.textContent = typeof r === 'string' ? r : fx(r, dec); if (almTag) UI.alarmClass(g, S, almTag); });
    if (almTag) { g.style.cursor = 'pointer'; g.addEventListener('click', () => UI.select(almTag)); }
    return g;
  };
  // distillation column with trays; horizontal drum with optional water boot; fired heater box
  d.column = (x, y, w, hh, label, trays) => {
    const g = sv('g', {}, L.eq); sv('rect', { x, y, width: w, height: hh, rx: w / 2.2, class: 'eq' }, g);
    for (const t of trays || []) { const ty = y + t[0] * hh; sv('line', { x1: x + 4, y1: ty, x2: x + w - 4, y2: ty, stroke: '#8d9195', 'stroke-width': 1 }, g); if (t[1]) { const tl = sv('text', { x: x + w / 2, y: ty - 2, class: 'lbl s', 'text-anchor': 'middle' }, g); tl.textContent = t[1]; } }
    if (label) d.label(x + w / 2, y + hh + 14, label, 'lbl', 'middle');
    return g;

/* ---------------- 7. TREND RENDERER ---------------- */
UI.PEN = ['#1f5fbf', '#c0392b', '#2e7d32', '#8e44ad', '#d07a00', '#00838f'];
UI.drawTrend = function (cv, lg, S, keys, win, fixed) {
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth || 300, H = cv.clientHeight || +cv.getAttribute('height');
  if (cv.width !== Math.round(W * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  const x = cv.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, W, H);
  const t = S.hist.t, t1 = S.t, t0 = t1 - win, padL = 4, padR = 4, padT = 6, padB = 16;
  x.strokeStyle = '#cfd1d3'; x.lineWidth = 1; x.font = '10px Segoe UI'; x.fillStyle = '#555';
  for (let i = 0; i <= 6; i++) { const xx = padL + (W - padL - padR) * i / 6; x.beginPath(); x.moveTo(xx, padT); x.lineTo(xx, H - padB); x.stroke();
    const tm = t0 + win * i / 6; x.textAlign = i === 0 ? 'left' : i === 6 ? 'right' : 'center'; x.fillText(CDU.fmtT(Math.max(0, tm)).slice(-8, -3), xx, H - 4); }
  for (let i = 0; i <= 4; i++) { const yy = padT + (H - padT - padB) * i / 4; x.beginPath(); x.moveTo(padL, yy); x.lineTo(W - padR, yy); x.stroke(); }
  if (lg) lg.innerHTML = '';
  keys.forEach((k, i) => {
    const d = S.hist.d[k] || [], def = CDU.HV[k];
    let lo = Infinity, hi = -Infinity;
    for (let j = 0; j < t.length; j++) if (t[j] >= t0) { lo = Math.min(lo, d[j]); hi = Math.max(hi, d[j]); }
    const cur = def[2](S); lo = Math.min(lo, cur); hi = Math.max(hi, cur);
    if (fixed && fixed[k]) { lo = fixed[k][0]; hi = fixed[k][1]; }
    if (!isFinite(lo)) { lo = 0; hi = 1; }
    const pad = Math.max((hi - lo) * 0.1, Math.abs(hi) * 0.02, 0.05); lo -= pad; hi += pad;
    const X = (tt) => padL + (W - padL - padR) * (tt - t0) / win, Y = (v) => padT + (H - padT - padB) * (1 - (v - lo) / (hi - lo));
    x.strokeStyle = UI.PEN[i % UI.PEN.length]; x.lineWidth = 1.6; x.beginPath(); let st = false;
    for (let j = 0; j < t.length; j++) { if (t[j] < t0) continue; const px = X(t[j]), py = Y(d[j]); if (!st) { x.moveTo(px, py); st = true; } else x.lineTo(px, py); }
    if (st) x.lineTo(X(t1), Y(cur)); x.stroke();
    if (lg) { lg.insertAdjacentHTML('beforeend', `<i style="background:${UI.PEN[i % UI.PEN.length]}"></i><span>${def[0]}</span><span class="v">${fx(cur, Math.abs(cur) < 10 ? 2 : 1)} ${def[1]}</span><span class="r">${fx(lo, 1)}–${fx(hi, 1)}</span>`); }
  });
};

/* ---------------- 9. ALARM SOUNDS (Web Audio, synthesised — no sound files) ----------------
   P1: fast two-tone warble, repeats every 1.4 s until ACK / SILENCE
   P2: double beep, repeats every 4 s until ACK / SILENCE
   P3: single soft chime, once per new alarm
   Silence = horn off for the alarms standing now; any new alarm sounds again.                */
UI.audio = (function () {
  const ss = (k, v) => { try { if (v === undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k, v); } catch (e) { return null; } };
  const ls = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };
  const A = { ctx: null, on: ls('cdusound') !== 'off', sounding: false, next: 0, cur: 0 };
  const silenced = new Set(JSON.parse(ss('cdusil') || '[]')), played = new Set(JSON.parse(ss('cduplayed') || '[]'));
  const keep = () => { ss('cdusil', JSON.stringify([...silenced].slice(-200))); ss('cduplayed', JSON.stringify([...played].slice(-200))); };
  const key = (a) => a.id + '@' + Math.round(a.t);
  function unlock() {
    if (!A.ctx) { try { A.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } }
    if (A.ctx.state === 'suspended') A.ctx.resume();
  }
  ['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, unlock, true));
  function claimSound() { ls('cdusndowner', JSON.stringify({ id: CDU.rt.id, ts: Date.now() })); }
  ['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, claimSound, true));
  window.addEventListener('focus', claimSound);
  function tone(f, t0, dur, type, vol, f2) {
    const c = A.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0); if (f2) o.frequency.linearRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
    g.gain.setValueAtTime(vol, t0 + dur - 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  }
  A.play = function (p) {
    if (!A.ctx || A.ctx.state !== 'running') return;
    const t = A.ctx.currentTime + 0.02;
    if (p === 1) for (let i = 0; i < 6; i++) tone(i % 2 ? 700 : 1050, t + i * 0.14, 0.13, 'square', 0.10);
    else if (p === 2) { tone(620, t, 0.22, 'triangle', 0.22); tone(620, t + 0.32, 0.22, 'triangle', 0.22); }
    else tone(1046, t, 0.35, 'sine', 0.18, 784);
  };
  // PSV relief sound: filtered white noise — a "kshhhh" burst on lift, then a steady roar while relieving
  let hiss = null;
  function hissOn(level) {
    if (!A.ctx || A.ctx.state !== 'running') return;
    const c = A.ctx;
    if (!hiss) {
      const len = c.sampleRate * 2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
      const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1500;
      const pk = c.createBiquadFilter(); pk.type = 'peaking'; pk.frequency.value = 4200; pk.Q.value = 0.8; pk.gain.value = 7;
      const g = c.createGain(); g.gain.setValueAtTime(0.0001, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.55, c.currentTime + 0.04);            // pop
      g.gain.exponentialRampToValueAtTime(0.12 + 0.16 * level, c.currentTime + 0.9);  // settle to roar
      src.connect(hp); hp.connect(pk); pk.connect(g); g.connect(c.destination); src.start();
      hiss = { src, g };
    } else hiss.g.gain.setTargetAtTime(0.12 + 0.16 * level, c.currentTime, 0.4);
  }
  function hissOff() { if (!hiss) return; const c = A.ctx, x = hiss; hiss = null; x.g.gain.setTargetAtTime(0.0001, c.currentTime, 0.3); x.src.stop(c.currentTime + 1.5); }
  // flare roar: low-pass brown noise with a slow flicker; louder and deeper as flare load rises
  let roar = null;
  function roarOn(level) {
    if (!A.ctx || A.ctx.state !== 'running') return;
    const c = A.ctx, vol = 0.06 + 0.5 * level;
    if (!roar) {
      const len = c.sampleRate * 3, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
      let last = 0; for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
      const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
      const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 260 + 380 * level; lp.Q.value = 0.7;
      const g = c.createGain(); g.gain.value = 0.0001;
      const flick = c.createGain(); flick.gain.value = 1;                    // flame flicker
      const lfo = c.createOscillator(); lfo.frequency.value = 2.3; const lfoG = c.createGain(); lfoG.gain.value = 0.25;
      lfo.connect(lfoG); lfoG.connect(flick.gain); lfo.start();
      src.connect(lp); lp.connect(flick); flick.connect(g); g.connect(c.destination); src.start();
      g.gain.setTargetAtTime(vol, c.currentTime, 0.6);
      roar = { src, g, lp, lfo };
    } else { roar.g.gain.setTargetAtTime(vol, c.currentTime, 0.8); roar.lp.frequency.setTargetAtTime(260 + 380 * level, c.currentTime, 0.8); }
  }
  function roarOff() { if (!roar) return; const c = A.ctx, x = roar; roar = null; x.g.gain.setTargetAtTime(0.0001, c.currentTime, 0.8); x.src.stop(c.currentTime + 4); x.lfo.stop(c.currentTime + 4); }
  A.testRoar = () => { unlock(); setTimeout(() => { roarOn(0.5); setTimeout(roarOff, 3500); }, 60); };
  A.testHiss = () => { unlock(); setTimeout(() => { hissOn(0.6); setTimeout(hissOff, 2200); }, 60); };
  A.test = (p) => { unlock(); setTimeout(() => A.play(p), 60); };
  A.toggle = () => { A.on = !A.on; ls('cdusound', A.on ? 'on' : 'off'); if (A.on) unlock(); CDU.render(); };
  A.silence = () => { const S = CDU.rt.S; if (!S) return; S.alarms.forEach(a => silenced.add(key(a))); keep(); A.sounding = false; CDU.render(); };
  A.update = function (S) {
    if (!S) return;
    const live = S.alarms.filter(a => a.active && !a.acked && !silenced.has(key(a)));
    const horn = live.filter(a => a.prio <= 2);
    const p = horn.length ? Math.min(...horn.map(a => a.prio)) : 0;
    A.sounding = p > 0;
    const relieving = S.psv ? Object.values(S.psv).filter(x => x.open) : [];
    A.relieving = relieving.length > 0;
    if (!A.on || document.hidden || S.frozen) { hissOff(); roarOff(); return; }
    // with several windows open, only one plays the horn: the last one you clicked or focused
    let o = null; try { o = JSON.parse(ls('cdusndowner') || 'null'); } catch (e) { o = null; }
    if (!o || Date.now() - o.ts > 3000 || o.id === CDU.rt.id) claimSound(); else { hissOff(); roarOff(); return; }
    if (relieving.length) hissOn(Math.min(1, relieving.reduce((s, x) => s + x.f, 0) / 30)); else hissOff();
    const fl = S.p.flare || 0;                                    // flare roar above 1 t/h, full at ≈ 40 t/h
    if (fl > 1) roarOn(Math.min(1, (fl - 1) / 40)); else if (fl < 0.8) roarOff();
    const now = Date.now();
    if (p && (now >= A.next || p < A.cur)) { A.play(p); A.cur = p; A.next = now + (p === 1 ? 1400 : 4000); }
    if (!p) A.cur = 0;
    const fresh = live.filter(a => a.prio === 3 && !played.has(key(a)));
    if (fresh.length) { fresh.forEach(a => played.add(key(a))); keep(); if (!p) A.play(3); }
  };
  return A;
})();

/* ---------------- 12. APP INSTALL & AUTOMATIC UPDATES ----------------
   When served over http(s) (GitHub Pages or the local launcher) the simulator registers a service
   worker (sw.js): pages load fresh when online and still work offline. version.json is checked every
   10 min; if a newer version has been published, a banner offers to reload. Browsers that support it
   show an INSTALL APP button so the simulator gets its own window and desktop icon.              */
UI.appInit = function () {
  if (window.CDU_SINGLE) {                                       // single-file offline copy: just tell the user if a newer one is online
    setTimeout(async () => {
      try {
        const j = await (await fetch(UI.ONLINE + 'version.json?t=' + Date.now(), { cache: 'no-store' })).json();
        if (j && j.ver > CDU.CODE_VER && !$('#szupd') && !UI.isPop) {
          const b = h('div', { id: 'szupd' }, '<b>Newer version ' + (j.label || j.ver) + ' is online</b><span>' + (j.notes || '') + '</span>');
          b.append(h('button', { class: 'on', on: { click: () => window.open(UI.ONLINE, '_blank') } }, 'Open online version'),
            h('button', { on: { click: () => window.open(UI.ONLINE + 'docs/CDU-DCS-Simulator-offline.html', '_blank') } }, 'Download new single file'),
            h('button', { on: { click: () => b.remove() } }, 'Later'));
          document.body.append(b);
        }
      } catch (e) { }                                             // offline: nothing to check
    }, 5000);
    return;
  }
  if (!/^https?:/.test(location.protocol)) return;            // opened from a folder (file://): no app features
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
  const check = async () => {
    try {
      const j = await (await fetch('version.json?t=' + Date.now(), { cache: 'no-store' })).json();
      if (j && j.ver > CDU.CODE_VER && !$('#szupd')) {
        const b = h('div', { id: 'szupd' }, '<b>New version ' + (j.label || j.ver) + ' available</b><span>' + (j.notes || '') + '</span>');
        const r = h('button', { class: 'on', on: { click: () => { CDU.save && CDU.save(); location.reload(); } } }, 'Reload now');
        const x = h('button', { on: { click: () => b.remove() } }, 'Later');
        b.append(r, x); document.body.append(b);
      }
    } catch (e) { }
  };
  setTimeout(check, 4000); setInterval(check, 10 * 60 * 1000);
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault(); UI.installEvt = e;
    if ($('#szinst') || UI.isPop) return;
    const ib = h('button', { id: 'szinst', title: 'Install the simulator as an app (own window, desktop icon, works offline)' }, '⬇ INSTALL APP');
    ib.addEventListener('click', async () => { UI.installEvt.prompt(); await UI.installEvt.userChoice; ib.remove(); });
    $('#hdr .hrow').append(ib);
  });
};
